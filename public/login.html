<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutroVia — Iniciar sesión</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=20260903login3">
    <script>document.documentElement.setAttribute('data-theme','nutrovia')</script>
    <script src="js/icons.js"></script>

    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div class="login-split">
        <!-- Left: form panel -->
        <div class="login-panel">
            <div class="login-panel-content">
                <div class="auth-logo">
                    <div class="nav-logo" style="justify-content:flex-start;margin-bottom:26px;">
                        <img src="img/logo/logo_nutrovia_negro.png" alt="NutroVia" class="login-logo-mark">
                        <span class="logo-text">NUTROVIA</span><span class="logo-dot">.</span>
                    </div>
                    <h1 class="auth-title">Bienvenido/a de vuelta</h1>
                    <p class="auth-subtitle">Accede a tu plan personalizado</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="login-email" class="form-input" placeholder="tu@email.com" required
                            autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required
                            autocomplete="current-password">
                    </div>
                    <div id="login-alert" class="alert alert-error" style="display:none"></div>
                    <button type="submit" class="btn-gold-large" style="width:100%;justify-content:space-between;margin-top:12px;"
                        id="loginBtn">
                        Entrar <span class="btn-arrow">→</span>
                    </button>
                </form>

                <div class="login-links">
                    <a href="#" class="login-link" onclick="return false;">¿Olvidaste tu contraseña?</a>
                    <a href="questionnaire.html" class="login-link">Crear cuenta</a>
                </div>
            </div>
        </div>

        <!-- Right: image panel (B&W) -->
        <div class="login-media">
            <img src="img/meal_prep_2.jpg" alt="Preparación de comidas">
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay" style="display:none">
        <div class="spinner"></div>
        <p class="loading-text">Iniciando sesión...</p>
    </div>


    <script src="js/login.js"></script>
</body>

</html>
